name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    env:
      HUGO_VERSION: 0.160.1
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --baseURL "https://taskdesklab.com/"

      - name: defab_gate v3 (review articles changed since the last successful deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet pyyaml
          BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          python3 tools/defab_gate_v3.py ci "${BASE:-${{ github.event.before }}}"

      - name: IndexNow URL list (content changed since the last successful deploy)
        id: indexnow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          echo "urls=$(python3 tools/indexnow_urls.py "${BASE:-${{ github.event.before }}}")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow (Bing etc.): notify changed URLs once they are live.
  # Key file lives at static/<key>.txt. Failure here never blocks a deploy.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_urls != '' && needs.build.outputs.indexnow_urls != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit to IndexNow
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
          KEY: 940276a2ed4e1783a2e84c90b2e70a56
        run: |
          BODY=$(python3 -c 'import json,os; print(json.dumps({"host":"taskdesklab.com","key":os.environ["KEY"],"keyLocation":"https://taskdesklab.com/"+os.environ["KEY"]+".txt","urlList":json.loads(os.environ["URLS"])}))')
          echo "$BODY" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["urlList"]), "urls")'
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data "$BODY"
